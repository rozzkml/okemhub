<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0e14"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7aa2ff"/>
      <stop offset="100%" stop-color="#5b8cff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="102" fill="none" stroke="#5b8cff" stroke-opacity="0.12" stroke-width="3"/>
  <!-- O — accent blue with subtle glow -->
  <text x="148" y="348" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="270" font-weight="800" fill="url(#blue)" filter="url(#glow)">O</text>
  <!-- H — light gray -->
  <text x="268" y="348" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="270" font-weight="800" fill="#e2e8f0">H</text>
</svg>
