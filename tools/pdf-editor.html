<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>PDF Editor — okemhub</title>
  <meta name="description" content="okemhub PDF Editor — edit PDF files in your browser. Add text, images, shapes, signatures and more. Free, no uploads." />
  <meta name="theme-color" content="#0b0e14" />
  <meta name="robots" content="index, follow" />
  <meta property="og:title" content="PDF Editor — okemhub" />
  <meta property="og:description" content="Edit PDF files in your browser. Add text, images, shapes, signatures. Free, no uploads." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://okemhub.vercel.app/tools/pdf-editor.html" />
  <title>PDF Editor — okemhub</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📄</text></svg>" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,700;1,400;1,700&family=EB+Garamond:ital,wght@0,400;0,700;1,400;1,700&family=Fira+Code:wght@400;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,700;1,400;1,700&family=Merriweather:ital,wght@0,400;0,700;1,400;1,700&family=Montserrat:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Open+Sans:ital,wght@0,400;0,700;1,400;1,700&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Roboto:ital,wght@0,400;0,700;1,400;1,700&family=Source+Serif+4:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="pdf-editor.css" />
</head>
<body>
  <header class="nav">
    <a class="brand" href="../index.html">⚡ okemhub</a>
    <nav class="links">
      <a href="../index.html#tools">Tools</a>
      <span class="nav-title">PDF Editor</span>
    </nav>
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">◐</button>
  </header>

  <div id="app">
    <!-- Upload Screen -->
    <div id="upload-screen" class="upload-screen">
      <div class="upload-box" id="drop-zone">
        <div class="upload-icon">📄</div>
        <h2>Edit your PDF</h2>
        <p class="muted">Drag &amp; drop a PDF file here, or click to select</p>
        <label class="btn primary upload-btn">
          Upload PDF
          <input type="file" id="file-input" accept="application/pdf" hidden />
        </label>
        <p class="upload-note">Your files stay private — everything runs in your browser.</p>
      </div>
    </div>

    <!-- Editor Screen -->
    <div id="editor-screen" class="editor-screen hidden">
      <!-- Toolbar (Ribbon style) -->
      <div class="ribbon" id="toolbar">
        <div class="ribbon-tabs">
          <button class="ribbon-tab" data-tool="select" title="Select (V)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg>
            <span>Select</span>
          </button>
          <div class="ribbon-divider"></div>
          <button class="ribbon-tab active" data-tool="text" title="Add Text (T)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>
            <span>Text</span>
          </button>
          <button class="ribbon-tab" data-tool="image" title="Add Image (I)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            <span>Image</span>
          </button>
          <button class="ribbon-tab" data-tool="draw" title="Freehand Draw (D)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.83 2.83 0 114 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
            <span>Draw</span>
          </button>
          <div class="ribbon-divider"></div>
          <button class="ribbon-tab" data-tool="highlight" title="Highlight (H)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            <span>Highlight</span>
          </button>
          <button class="ribbon-tab" data-tool="whiteout" title="Whiteout (W)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="3" x2="21" y2="21" opacity="0.4"/></svg>
            <span>Whiteout</span>
          </button>
          <div class="ribbon-divider"></div>
          <button class="ribbon-tab" data-tool="shape" title="Shapes (S)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><circle cx="17.5" cy="17.5" r="4.5"/><line x1="14" y1="4" x2="21" y2="11"/></svg>
            <span>Shapes</span>
          </button>
          <button class="ribbon-tab" data-tool="sign" title="Signature (G)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17c3-3 5-8 9-8s3 5 6 5 3-3 3-3"/></svg>
            <span>Sign</span>
          </button>
          <button class="ribbon-tab" data-tool="link" title="Add Link (L)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
            <span>Link</span>
          </button>
          <button class="ribbon-tab" data-tool="note" title="Sticky Note (N)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15.5 3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V8.5L15.5 3z"/><polyline points="14,3 14,8 21,8"/></svg>
            <span>Note</span>
          </button>
        </div>
        <div class="ribbon-options" id="tool-options"></div>
      </div>

      <!-- Main Content -->
      <div class="editor-body">
        <div class="canvas-area" id="canvas-area">
          <div class="canvas-wrapper" id="canvas-wrapper">
            <canvas id="pdf-canvas"></canvas>
            <canvas id="overlay-canvas"></canvas>
            <div id="annotation-layer"></div>
          </div>
        </div>

        <div class="sidebar" id="sidebar">
          <div class="sidebar-header">
            <span>Pages</span>
            <span id="page-info" class="muted">0 / 0</span>
          </div>
          <div class="page-list" id="page-list"></div>
        </div>
      </div>

      <!-- Bottom Bar -->
      <div class="bottom-bar">
        <div class="bottom-left">
          <button class="icon-btn" id="btn-undo" title="Undo (Ctrl+Z)" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1,4 1,10 7,10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
          </button>
          <button class="icon-btn" id="btn-redo" title="Redo (Ctrl+Y)" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23,4 23,10 17,10"/><path d="M20.49 15a9 9 0 11-2.13-9.36L23 10"/></svg>
          </button>
          <span class="separator"></span>
          <button class="icon-btn" id="btn-zoom-out" title="Zoom Out">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
          </button>
          <span id="zoom-level">100%</span>
          <button class="icon-btn" id="btn-zoom-in" title="Zoom In">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
          </button>
          <button class="icon-btn" id="btn-zoom-fit" title="Fit to Width">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/></svg>
          </button>
        </div>
        <div class="bottom-center">
          <button class="icon-btn" id="btn-prev" title="Previous Page">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15,18 9,12 15,6"/></svg>
          </button>
          <span id="page-nav">Page 1</span>
          <button class="icon-btn" id="btn-next" title="Next Page">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9,18 15,12 9,6"/></svg>
          </button>
        </div>
        <div class="bottom-right">
          <span class="pdf-password-wrap" title="Optional: encrypt the exported PDF">
            <input type="password" id="pdf-password" placeholder="Encrypt (pw)" autocomplete="off" />
          </span>
          <button class="btn primary" id="btn-download">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Download PDF
          </button>
          <button class="btn" id="btn-new-file">New File</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Signature Modal -->
  <div id="sign-modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Create Signature">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Create Signature</h3>
        <button class="modal-close" id="sign-close" aria-label="Close">&times;</button>
      </div>
      <div class="modal-tabs">
        <button class="tab active" data-tab="draw">Draw</button>
        <button class="tab" data-tab="type">Type</button>
        <button class="tab" data-tab="upload">Upload</button>
      </div>
      <div class="modal-body">
        <div id="tab-draw" class="tab-content active">
          <canvas id="sign-canvas" width="400" height="150"></canvas>
          <button class="btn" id="sign-clear">Clear</button>
        </div>
        <div id="tab-type" class="tab-content">
          <input type="text" id="sign-text" placeholder="Type your name" class="sign-input" />
          <div id="sign-preview" class="sign-preview"></div>
        </div>
        <div id="tab-upload" class="tab-content">
          <label class="btn">
            Choose Image
            <input type="file" id="sign-file" accept="image/*" hidden />
          </label>
          <div id="sign-upload-preview" class="sign-preview"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" id="sign-cancel">Cancel</button>
        <button class="btn primary" id="sign-apply">Apply Signature</button>
      </div>
    </div>
  </div>

  <!-- Link Modal -->
  <div id="link-modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Add Link">
    <div class="modal-content modal-sm">
      <div class="modal-header">
        <h3>Add Link</h3>
        <button class="modal-close" id="link-close" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <label class="field-label" for="link-url">URL</label>
        <input type="url" id="link-url" placeholder="https://example.com" class="sign-input" />
      </div>
      <div class="modal-footer">
        <button class="btn" id="link-cancel">Cancel</button>
        <button class="btn primary" id="link-apply">Add Link</button>
      </div>
    </div>
  </div>

  <!-- Note Modal -->
  <div id="note-modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Add Note">
    <div class="modal-content modal-sm">
      <div class="modal-header">
        <h3>Add Note</h3>
        <button class="modal-close" id="note-close" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <textarea id="note-text" placeholder="Type your note..." class="sign-input" rows="4"></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn" id="note-cancel">Cancel</button>
        <button class="btn primary" id="note-apply">Add Note</button>
      </div>
    </div>
  </div>

  <!-- Hidden file input for image tool -->
  <input type="file" id="image-input" accept="image/*" hidden />
  <!-- Toast -->
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <!-- Vendored libraries (self-hosted, no CDN, CVE-patched) -->
  <script src="../vendor/pdf-lib/pdf-lib.min.js"></script>
  <script src="../vendor/fontkit/fontkit.umd.min.js"></script>
  <!-- External module (not inline) so the CSP can stay at script-src 'self' -->
  <script type="module" src="../vendor/pdfjs-boot.mjs"></script>
  <script src="../theme.js"></script>
  <script src="pdf-editor.js"></script>
</body>
</html>
