<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="okemhub — a collection of free, client-side web tools. No accounts, no uploads, just functions." />
  <meta name="theme-color" content="#0b0e14" />
  <title>okemhub — free web tools</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="nav">
    <a class="brand" href="#top">⚡ okemhub</a>
    <nav class="links">
      <a href="#tools">Tools</a>
    </nav>
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">◐</button>
  </header>

  <main id="top">
    <section class="hero">
      <h1>Free web tools,<br />no strings attached.</h1>
      <p class="lede">
        okemhub is a collection of small, free functions that run entirely in
        your browser. No accounts, no uploads — just tools that work.
      </p>
    </section>

    <section id="tools" class="section">
      <h2>Tools</h2>
      <p class="muted">All processing happens on your device. Nothing is sent to a server.</p>
      <div class="grid" id="tool-grid">
        <!-- cards injected by script.js -->
      </div>
    </section>
  </main>

  <footer class="foot">
    <span>© <span id="year"></span> okemhub</span>
    <span class="muted">Free client-side tools.</span>
  </footer>

  <script src="theme.js"></script>
  <script src="script.js"></script>
</body>
</html>
